<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas — AI Browser Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
    }
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2a2a4a;
    }
    .logo { font-size: 24px; }
    .title { font-size: 15px; font-weight: 600; color: #7c83fd; }
    .subtitle { font-size: 11px; color: #666; margin-top: 2px; }
    .status-row {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1a1a1a;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4444;
      animation: pulse 2s infinite;
    }
    .dot.connected { background: #44ff88; }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-text { font-size: 12px; color: #aaa; }
    .info {
      padding: 12px 16px;
      font-size: 11px;
      color: #555;
      line-height: 1.6;
    }
    .info a { color: #7c83fd; text-decoration: none; }
    .btn {
      margin: 0 16px 16px;
      padding: 8px 0;
      background: #7c83fd22;
      border: 1px solid #7c83fd44;
      border-radius: 6px;
      color: #7c83fd;
      font-size: 12px;
      cursor: pointer;
      width: calc(100% - 32px);
      transition: all .2s;
    }
    .btn:hover { background: #7c83fd33; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🌐</div>
    <div>
      <div class="title">Atlas</div>
      <div class="subtitle">AI Browser Controller</div>
    </div>
  </div>

  <div class="status-row">
    <div class="dot" id="dot"></div>
    <div class="status-text" id="status">Sunucuya bağlanılıyor...</div>
  </div>

  <div class="info">
    Atlas, AI ajanının Chrome sekmelerini kontrol etmesini sağlar.<br><br>
    Sunucu: <a href="http://localhost:8000" target="_blank">localhost:8000</a>
  </div>

  <button class="btn" id="openBtn">🚀 Atlas UI'ı Aç</button>

  <script src="popup.js"></script>
</body>
</html>
